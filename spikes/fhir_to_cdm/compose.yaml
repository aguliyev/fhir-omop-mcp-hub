name: ${COMPOSE_PROJECT_NAME:-fhir_to_cdm_spike}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine}
    platform: ${SPIKE_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fhir_to_cdm_spike}
      POSTGRES_USER: ${POSTGRES_USER:-spike_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spike_secret_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    shm_size: 2g
    volumes:
      - spike_pgdata:/var/lib/postgresql/data
      - ${DATA_ROOT:-./data}:/data:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  converter:
    build: ./converter
    platform: ${SPIKE_PLATFORM:-linux/amd64}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-fhir_to_cdm_spike}
      PGUSER: ${POSTGRES_USER:-spike_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-spike_secret_change_me}
    volumes:
      - ${SPIKE_WORK_DIR:-./work}:/work
    profiles: ["converter"]

  synthea:
    build: ./synthea
    platform: ${SPIKE_PLATFORM:-linux/amd64}
    volumes:
      - ${SPIKE_WORK_DIR:-./work}:/work
    profiles: ["synthea"]

volumes:
  spike_pgdata:
