[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omop-mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.29.1", "httpx==0.28.1", "pydantic==2.13.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]
